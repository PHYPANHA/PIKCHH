services:
  institute-service:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: institutes
      DB_USER: institute
      DB_PASSWORD: ${DB_PASSWORD:-institute-local}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: institutes
      POSTGRES_USER: institute
      POSTGRES_PASSWORD: ${DB_PASSWORD:-institute-local}
    ports:
      - "5432:5432"
    volumes:
      - institute-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U institute -d institutes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  institute-data:
